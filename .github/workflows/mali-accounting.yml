name: Mali memory accounting contracts
on:
  push:
    branches: [revival/mali-accounting-bounds]
  pull_request:
    branches: [lineage-23.2]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_mali_accounting.py' -v
